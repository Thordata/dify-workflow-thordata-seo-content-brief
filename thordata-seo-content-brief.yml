    - id: output
      type: custom
      width: 260
      height: 120
      position:
        x: 5440
        y: 0
      positionAbsolute:
        x: 5440
        y: 0
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: Prepare output
        type: code
        desc: Unpack the result into status, Markdown, structured brief, evidence, warnings, and error code.
        selected: false
        code_language: python3
        code: |
          import json

          def _json(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"), allow_nan=False)


          def _reject_constants(value):
              raise ValueError("Non-finite JSON values are not permitted")


          def _unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Duplicate JSON keys are not permitted")
                  result[key] = value
              return result


          def failure_result(status: str, error_code: str, evidence: dict | None = None) -> dict:
              allowed_status = {
                  "invalid_input",
                  "search_failed",
                  "no_results",
                  "generation_failed",
              }
              allowed_codes = {
                  "invalid_input",
                  "serp_tool_error",
                  "invalid_serp_response",
                  "no_results",
                  "evidence_too_large",
                  "llm_call_failed",
                  "brief_validation_failed",
              }
              return {
                  "status": status if status in allowed_status else "generation_failed",
                  "brief_markdown": "",
                  "brief_json": {},
                  "evidence_json": _json(evidence) if isinstance(evidence, dict) else "{}",
                  "warnings": list(evidence.get("warnings", []))
                  if isinstance(evidence, dict)
                  else [],
                  "error_code": error_code
                  if error_code in allowed_codes
                  else "brief_validation_failed",
              }


          def unpack_result(result_json) -> dict:
              fallback = failure_result("generation_failed", "brief_validation_failed")
              try:
                  result = json.loads(
                      result_json,
                      parse_constant=_reject_constants,
                      object_pairs_hook=_unique_object,
                  )
                  if not isinstance(result, dict) or set(result) != set(fallback):
                      return fallback
                  if any(
                      not isinstance(result[key], str)
                      for key in ("status", "brief_markdown", "evidence_json", "error_code")
                  ):
                      return fallback
                  if not isinstance(result["brief_json"], dict) or not isinstance(
                      result["warnings"], list
                  ):
                      return fallback
                  if any(not isinstance(warning, str) for warning in result["warnings"]):
                      return fallback
                  return result
              except (ValueError, TypeError, RecursionError):
                  return fallback


          def main(result_json):
              return unpack_result(result_json)
        variables:
        - variable: result_json
          value_selector:
          - result
          - output
          value_type: string
        outputs:
          status:
            type: string
            children: null
          brief_markdown:
            type: string
            children: null
          brief_json:
            type: object
            children: null
          evidence_json:
            type: string
            children: null
          warnings:
            type: array[string]
            children: null
          error_code:
            type: string
            children: null
