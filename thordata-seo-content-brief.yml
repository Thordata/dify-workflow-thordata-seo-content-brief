    - id: prepare
      type: custom
      width: 260
      height: 120
      position:
        x: 340
        y: 0
      positionAbsolute:
        x: 340
        y: 0
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: Prepare search
        type: code
        desc: Validate inputs and prepare the query and market settings for Google search.
        selected: false
        code_language: python3
        code: |
          import json
          import re

          def _json(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"), allow_nan=False)


          def validate_input(
              keyword: str,
              market: str = "us_en",
              audience: str = "",
              brand_context: str = "",
              site_domain: str = "",
          ) -> dict:
              values = {
                  "keyword": keyword,
                  "market": market,
                  "audience": audience,
                  "brand_context": brand_context,
                  "site_domain": site_domain,
              }
              limits = {
                  "keyword": 200,
                  "market": 20,
                  "audience": 500,
                  "brand_context": 3000,
                  "site_domain": 253,
              }
              for name, value in values.items():
                  controls = (
                      r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]"
                      if name == "brand_context"
                      else r"[\x00-\x1f\x7f]"
                  )
                  if (
                      not isinstance(value, str)
                      or len(value.strip()) > limits[name]
                      or re.search(controls, value)
                  ):
                      return {"valid": False, "config": {}, "error_code": "invalid_input"}
              keyword, market = keyword.strip(), market.strip()
              if not keyword or market not in {"us_en", "gb_en"}:
                  return {"valid": False, "config": {}, "error_code": "invalid_input"}
              domain = site_domain.strip().lower()
              if domain:
                  try:
                      domain = domain.encode("idna").decode("ascii")
                      labels = domain.split(".")
                      valid_domain = (
                          len(domain) <= 253
                          and len(labels) >= 2
                          and all(
                              re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", label)
                              for label in labels
                          )
                      )
                      if not valid_domain:
                          raise ValueError("Invalid domain")
                  except (ValueError, UnicodeError):
                      return {"valid": False, "config": {}, "error_code": "invalid_input"}
              config = {
                  "keyword": keyword,
                  "market": market,
                  "output_language": "en",
                  "audience": audience.strip(),
                  "brand_context": brand_context.strip(),
                  "site_domain": domain,
                  "site_query": "site:" + domain + " " + keyword if domain else "",
              }
              return {"valid": True, "config": config, "error_code": ""}


          def failure_result(status: str, error_code: str, evidence: dict | None = None) -> dict:
              allowed_status = {
                  "invalid_input",
                  "search_failed",
                  "no_results",
                  "generation_failed",
              }
              allowed_codes = {
                  "invalid_input",
                  "serp_tool_error",
                  "invalid_serp_response",
                  "no_results",
                  "evidence_too_large",
                  "llm_call_failed",
                  "brief_validation_failed",
              }
              return {
                  "status": status if status in allowed_status else "generation_failed",
                  "brief_markdown": "",
                  "brief_json": {},
                  "evidence_json": _json(evidence) if isinstance(evidence, dict) else "{}",
                  "warnings": list(evidence.get("warnings", []))
                  if isinstance(evidence, dict)
                  else [],
                  "error_code": error_code
                  if error_code in allowed_codes
                  else "brief_validation_failed",
              }


          def prepare_run(keyword, market, audience="", brand_context="", site_domain="") -> dict:
              validated = validate_input(
                  keyword,
                  market,
                  "" if audience is None else audience,
                  "" if brand_context is None else brand_context,
                  "" if site_domain is None else site_domain,
              )
              if not validated["valid"]:
                  return {
                      "valid": False,
                      "config": {},
                      "search_options": "{}",
                      "result_json": _json(failure_result("invalid_input", "invalid_input")),
                  }
              config = validated["config"]
              config["gl"] = "gb" if config["market"] == "gb_en" else "us"
              return {
                  "valid": True,
                  "config": config,
                  "search_options": _json({"gl": config["gl"], "hl": "en"}),
                  "result_json": "",
              }


          def main(keyword, market, audience='', brand_context='', site_domain=''):
              return prepare_run(keyword, market, audience, brand_context, site_domain)
        variables:
        - variable: keyword
          value_selector:
          - start
