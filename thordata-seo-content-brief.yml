        provider_type: builtin
        provider_show_name: Thordata SERP
        plugin_id: thordata/thordata_serp
        plugin_unique_identifier: thordata/thordata_serp:0.1.1@97c8705a29df75009d5caf4daa1f3b609fb1dbac62a1214a74a1f18bf710732f
