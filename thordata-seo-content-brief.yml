app:
  name: SEO Content Brief Generator - Thordata
  description: Create an English, source-backed SEO brief from live Google results and optional internal links. Compact workflow
    with validated citations and one repair attempt. SERP evidence only.
  icon: 📝
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: thordata/thordata_serp:0.1.1@97c8705a29df75009d5caf4daa1f3b609fb1dbac62a1214a74a1f18bf710732f
    version: null
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:1.1.0@1ded02acee56efd5788c86fd447d792e4923e959554a4942f440c7859d164340
    version: null
